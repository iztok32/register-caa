# docker-compose.yml — lokalno testiranje z Docker Build
# Uporaba: docker compose up --build

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: iztokvozlic/register-caa:latest
    ports:
      - "8081:80"
    environment:
      APP_NAME: "CAA - javni register"
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-http://localhost:8081}
      APP_LOCALE: sl
      APP_FALLBACK_LOCALE: en
      AVAILABLE_LANGUAGES: sl,en,de,it,hr
      AVAILABLE_COLOR_THEMES: zinc,amber,blue,emerald,orange
      LOG_CHANNEL: stderr
      LOG_LEVEL: warning
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: caa_register
      DB_USERNAME: caa_user
      DB_PASSWORD: ${DB_PASSWORD}
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      FILESYSTEM_DISK: local
      QUEUE_CONVERSIONS_BY_DEFAULT: "false"
      NOTIFICATION_ENABLE_PORTAL: "true"
      NOTIFICATION_ENABLE_EMAIL: "true"
      NOTIFICATION_ENABLE_SMS: "false"
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@register-caa.iztokv.eu}
      MAIL_FROM_NAME: "CAA - javni register"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - storage_app:/var/www/html/storage/app/public
      - storage_logs:/var/www/html/storage/logs
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    ports:
      - "5434:5432"    # lokalno: localhost:5434 (ne konflikta s kk-karlo na 5433)
    environment:
      POSTGRES_DB: caa_register
      POSTGRES_USER: caa_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caa_user -d caa_register"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  storage_app:
  storage_logs:
